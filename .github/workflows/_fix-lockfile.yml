name: _Fix lockfile from main
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/risk-radar-fra-epo-2wk5mk
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore package-lock.json from main
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: restore package-lock.json from main (Android lockfile corruption)"
            git push origin claude/risk-radar-fra-epo-2wk5mk
          fi
