name: Manual Preview Deployment

# CF secrets live in goldshore-ai only.
# This workflow fires a repository_dispatch there; goldshore-ai checks out
# this repo, builds it, and deploys using its own credentials.
#
# Required repo secret: GS_DISPATCH_TOKEN
#   A GitHub classic PAT with repo scope on marzton/goldshore-ai,
#   or a fine-grained token with permission to create repository_dispatch events.

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'The worker to deploy (e.g., goldshore-api, goldshore-gateway)'
        required: true
        type: choice
        options:
          - goldshore-api
          - goldshore-gateway
      branch:
        description: 'The branch to deploy to the preview environment'
        required: true

permissions:
  contents: read

jobs:
  dispatch-preview:
    name: Trigger preview deploy in goldshore-ai
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        run: |
          curl -s --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/marzton/goldshore-ai/dispatches \
            -d '{
              "event_type": "preview-deploy",
              "client_payload": {
                "repo": "marzton/goldshore-gateway",
                "ref": "${{ github.event.inputs.branch }}",
                "working_directory": "${{ github.event.inputs.worker }}",
                "install_command": "npm ci",
                "build_command": "npm run build --if-present",
                "wrangler_command": "deploy --env preview --name ${{ github.event.inputs.worker }}"
              }
            }'
          echo "Dispatched preview deploy to goldshore-ai for ${{ github.event.inputs.worker }}@${{ github.event.inputs.branch }}"
